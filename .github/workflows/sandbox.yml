name: Build & Deploy
on:
  push:
    branches: [sandbox]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Tioo Student Area
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.SANDBOX_SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.SANDBOX_SSH_KEY}} # Private or public key of the server
          username: ${{secrets.SANDBOX_USERNAME}} # User of the server you want to ssh into
     
          script: |
            cd "${{secrets.SANDBOX_WORK_TREE}}"
            git --work-tree="${{secrets.SANDBOX_WORK_TREE}}" --git-dir="${{secrets.SANDBOX_GIT_DIR}}" add .
            git --work-tree="${{secrets.SANDBOX_WORK_TREE}}" --git-dir="${{secrets.SANDBOX_GIT_DIR}}" reset --hard
            git --work-tree="${{secrets.SANDBOX_WORK_TREE}}" --git-dir="${{secrets.SANDBOX_GIT_DIR}}" pull origin sandbox
            echo 'Deployment successful to server'
