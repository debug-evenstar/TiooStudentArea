name: Build & Deploy Production
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Tioo Student Area
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.PRODUCTION_SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.PRODUCTION_SSH_KEY}} # Private or public key of the server
          username: ${{secrets.PRODUCTION_USERNAME}} # User of the server you want to ssh into
     
          script: |
            cd "${{secrets.PRODUCTION_WORK_TREE}}"
            git --work-tree="${{secrets.PRODUCTION_WORK_TREE}}" --git-dir="${{secrets.PRODUCTION_GIT_DIR}}" add .
            git --work-tree="${{secrets.PRODUCTION_WORK_TREE}}" --git-dir="${{secrets.PRODUCTION_GIT_DIR}}" reset --hard
            git --work-tree="${{secrets.PRODUCTION_WORK_TREE}}" --git-dir="${{secrets.PRODUCTION_GIT_DIR}}" pull origin main
            echo 'Deployment successful to server'
